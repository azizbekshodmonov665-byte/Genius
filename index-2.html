<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UzGenius</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --accent: #7c5cfc;
      --accent2: #e066ff;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --user-bg: #1a1030;
      --ai-bg: #111118;
      --glow: rgba(124, 92, 252, 0.25);
    }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(124,92,252,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 90%, rgba(224,102,255,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(12px);
    }

    .logo-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent), 0 0 24px rgba(124,92,252,0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #chat {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message {
      display: flex;
      gap: 12px;
      max-width: 780px;
      width: 100%;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.ai { align-self: flex-start; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      flex-shrink: 0;
      font-family: 'Syne', sans-serif;
      letter-spacing: 0.05em;
    }

    .message.user .avatar {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
    }

    .message.ai .avatar {
      background: var(--border);
      color: var(--accent);
      border: 1px solid rgba(124,92,252,0.3);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.7;
      max-width: calc(100% - 50px);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--user-bg);
      border: 1px solid rgba(124,92,252,0.25);
      border-radius: 12px 2px 12px 12px;
    }

    .message.ai .bubble {
      background: var(--ai-bg);
      border: 1px solid var(--border);
      border-radius: 2px 12px 12px 12px;
    }

    .typing-indicator {
      display: flex; gap: 5px; align-items: center;
      padding: 4px 0;
    }

    .typing-indicator span {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .welcome {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; flex: 1;
      gap: 16px; text-align: center;
      padding: 40px 20px;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-icon {
      width: 88px; height: 88px;
      border-radius: 24px;
      background: linear-gradient(135deg, #1a0f3a, #0f0a20);
      border: 1px solid rgba(124,92,252,0.4);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px rgba(124,92,252,0.25), 0 0 80px rgba(224,102,255,0.1);
      position: relative;
    }

    .welcome h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome p {
      font-size: 0.85rem;
      color: var(--muted);
      max-width: 340px;
      line-height: 1.7;
    }

    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 8px;
    }

    .suggestion-btn {
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(124,92,252,0.08);
    }

    .input-area {
      position: relative;
      z-index: 10;
      padding: 16px 20px 20px;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #userInput {
      flex: 1;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.88rem;
      outline: none;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      line-height: 1.5;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #userInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow);
    }
    #userInput::placeholder { color: var(--muted); }

    #sendBtn {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(124,92,252,0.3);
    }

    #sendBtn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,92,252,0.4); }
    #sendBtn:active { transform: translateY(0); }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #sendBtn svg { width: 18px; height: 18px; fill: white; }

    #micBtn {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    #micBtn:hover {
      border-color: var(--accent);
      background: rgba(124,92,252,0.1);
    }

    #micBtn.listening {
      background: rgba(220, 50, 50, 0.15);
      border-color: #dc3232;
      animation: micPulse 1s ease-in-out infinite;
    }

    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220,50,50,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(220,50,50,0); }
    }

    #micBtn svg { width: 18px; height: 18px; }

    #imgBtn {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    #imgBtn:hover {
      border-color: var(--accent2);
      background: rgba(224,102,255,0.1);
    }

    #imgBtn svg { width: 18px; height: 18px; }

    .image-preview {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid rgba(224,102,255,0.3);
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .image-preview img {
      width: 40px; height: 40px;
      border-radius: 6px;
      object-fit: cover;
    }

    .image-preview span {
      flex: 1;
      font-size: 0.78rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .image-preview button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .image-preview button:hover { color: #ff8080; }

    .bubble img {
      max-width: 220px;
      max-height: 200px;
      border-radius: 8px;
      display: block;
      margin-bottom: 6px;
      object-fit: cover;
    }

    #imgBtn {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    #imgBtn:hover {
      border-color: var(--accent2);
      background: rgba(224,102,255,0.1);
    }

    #imgBtn svg { width: 18px; height: 18px; }

    .image-preview {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid rgba(224,102,255,0.3);
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .image-preview img {
      width: 40px; height: 40px;
      object-fit: cover;
      border-radius: 6px;
    }

    .image-preview span {
      font-size: 0.78rem;
      color: var(--muted);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .image-preview button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .image-preview button:hover { color: #ff8080; }

    .bubble img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 8px;
      display: block;
      margin-bottom: 6px;
    }
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 10px;
      letter-spacing: 0.04em;
    }

    .error-bubble { color: #ff8080; }

    @media (max-width: 600px) {
      header { padding: 14px 16px; }
      #chat { padding: 16px 12px; }
      .input-area { padding: 12px 12px 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>UZGENIUS</h1>
  <span class="status" id="statusText">tayyor</span>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">
      <svg width="54" height="54" viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="ugGrad" x1="0" y1="0" x2="54" y2="54" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7c5cfc"/>
            <stop offset="100%" stop-color="#e066ff"/>
          </linearGradient>
          <linearGradient id="ugGrad2" x1="0" y1="0" x2="54" y2="54" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#a78bfa"/>
            <stop offset="100%" stop-color="#e066ff"/>
          </linearGradient>
        </defs>
        <!-- U harfi -->
        <path d="M4 10 L4 34 Q4 46 16 46 Q28 46 28 34 L28 10" 
              stroke="url(#ugGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <!-- G harfi -->
        <path d="M50 18 Q44 10 36 10 Q26 10 26 27 Q26 44 36 44 Q46 44 50 36 L50 27 L40 27" 
              stroke="url(#ugGrad2)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <h2>Salom! Men UzGenius</h2>
    <p>Sizga har qanday savol yoki muammoda yordam berishga tayyorman.</p>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="suggest(this)">O'zbekiston haqida gapir</button>
      <button class="suggestion-btn" onclick="suggest(this)">Dasturlashni o'rgatib ber</button>
      <button class="suggestion-btn" onclick="suggest(this)">Ingliz tilini o'rganishga yordam ber</button>
      <button class="suggestion-btn" onclick="suggest(this)">Ijodiy hikoya yoz</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div id="imagePreview" style="display:none" class="image-preview">
    <img id="previewImg" src="" alt="preview"/>
    <span id="previewName">rasm.jpg</span>
    <button onclick="removeImage()">✕</button>
  </div>
  <div class="input-row">
    <textarea id="userInput" placeholder="Xabar yozing..." rows="1"></textarea>
    <button id="imgBtn" onclick="document.getElementById('fileInput').click()" title="Rasm yuborish">
      <svg viewBox="0 0 24 24" fill="none" stroke="#e066ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </button>
    <button id="micBtn" onclick="toggleMic()" title="Ovozli xabar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7c5cfc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="11" rx="3"/>
        <path d="M19 10a7 7 0 0 1-14 0"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="9" y1="22" x2="15" y2="22"/>
      </svg>
    </button>
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="hint">Enter — yuborish &nbsp;·&nbsp; 🖼 — rasm &nbsp;·&nbsp; 🎤 — ovoz</div>
  <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(event)"/>
</div>

<script>
  let messages = [];
  let isLoading = false;
  let recognition = null;
  let isListening = false;
  let selectedImageBase64 = null;
  let selectedImageType = null;

  const chatEl = document.getElementById('chat');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const statusText = document.getElementById('statusText');

  function handleImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const result = ev.target.result;
      selectedImageBase64 = result.split(',')[1];
      selectedImageType = file.type;
      document.getElementById('previewImg').src = result;
      document.getElementById('previewName').textContent = file.name;
      document.getElementById('imagePreview').style.display = 'flex';
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function removeImage() {
    selectedImageBase64 = null;
    selectedImageType = null;
    document.getElementById('imagePreview').style.display = 'none';
    document.getElementById('previewImg').src = '';
  }

  // Speech Recognition sozlash
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'uz-UZ';
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      statusText.textContent = 'tinglayapman...';
      userInput.placeholder = '🎤 Gapiring...';
    };

    recognition.onresult = (e) => {
      const transcript = Array.from(e.results)
        .map(r => r[0].transcript).join('');
      userInput.value = transcript;
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      statusText.textContent = 'tayyor';
      userInput.placeholder = 'Xabar yozing...';
      // Agar matn bo'lsa avtomatik yuborish
      if (userInput.value.trim()) sendMessage();
    };

    recognition.onerror = (e) => {
      isListening = false;
      micBtn.classList.remove('listening');
      statusText.textContent = 'tayyor';
      userInput.placeholder = 'Xabar yozing...';
      if (e.error !== 'no-speech') {
        addMessage('ai', '🎤 Mikrofon xatosi: ' + e.error, true);
      }
    };
  }

  function toggleMic() {
    if (!SpeechRecognition) {
      addMessage('ai', '❌ Brauzeringiz ovozni qo\'llab-quvvatlamaydi. Chrome ishlatib ko\'ring.', true);
      return;
    }
    if (isListening) {
      recognition.stop();
    } else {
      recognition.lang = 'uz-UZ';
      recognition.start();
    }
  }

  function suggest(btn) {
    userInput.value = btn.textContent;
    userInput.focus();
  }

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
  });

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function addMessage(role, text, isError = false, imgSrc = null) {
    const w = document.getElementById('welcome');
    if (w) w.remove();

    const div = document.createElement('div');
    div.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'SIZ' : 'UZ';

    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' error-bubble' : '');

    if (imgSrc) {
      const img = document.createElement('img');
      img.src = imgSrc;
      bubble.appendChild(img);
    }

    if (text) {
      const textNode = document.createTextNode(text);
      bubble.appendChild(textNode);
    }

    div.appendChild(avatar);
    div.appendChild(bubble);
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function showTyping() {
    const w = document.getElementById('welcome');
    if (w) w.remove();

    const div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'typing';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'UZ';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

    div.appendChild(avatar);
    div.appendChild(bubble);
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    if (isLoading) return;
    const text = userInput.value.trim();
    if (!text && !selectedImageBase64) return;

    const imgSrc = selectedImageBase64 ? `data:${selectedImageType};base64,${selectedImageBase64}` : null;
    const imgBase64 = selectedImageBase64;
    const imgType = selectedImageType;

    userInput.value = '';
    userInput.style.height = 'auto';
    removeImage();
    isLoading = true;
    sendBtn.disabled = true;
    statusText.textContent = 'yozmoqda...';

    addMessage('user', text, false, imgSrc);

    // API uchun content qurish
    let userContent;
    if (imgBase64) {
      userContent = [
        { type: 'image', source: { type: 'base64', media_type: imgType, data: imgBase64 } },
        { type: 'text', text: text || 'Bu rasm haqida aytib ber.' }
      ];
    } else {
      userContent = text;
    }

    messages.push({ role: 'user', content: userContent });
    showTyping();

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Server xatosi');

      messages.push({ role: 'assistant', content: data.reply });
      removeTyping();
      addMessage('ai', data.reply);
      statusText.textContent = 'tayyor';

    } catch (err) {
      removeTyping();
      addMessage('ai', '❌ Xatolik: ' + err.message, true);
      messages.pop();
      statusText.textContent = 'xato';
    }

    isLoading = false;
    sendBtn.disabled = false;
    userInput.focus();
  }
</script>
